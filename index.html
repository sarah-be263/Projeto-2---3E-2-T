<!DOCTYPE html> <!--o Doctype indica a linguagem de programação que está sendo usaddo-->
<html lang="pt-br"> <!-- inicio do documento-->
<head> <!--início do cabeçalho do documento. dentro dessa tag pode ser inserida folhas de estilo e scr-->
    <meta charset="UTF-8"> <!--indica qual será os caracteres(character set or charsert) será utilizado p-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifólio</title> <!--título do projeto-->
</head> <!--fim do cabeçalho do documento-->
<body> <!--nesse espaço está o conteúdo visual da página. As tags que representam o texto, botões e outro-->
       <!--um documento html é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como caso da tag meta. Outro aspecto de linguagem é que ela é case insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas.-->
    <!--No HTML há seis níveis de cabeçalho/títulos que podem ser usados por meios das tags h1, h22, h3, h4, h5, h6, sendo h1 o maior e mais relevante e o h6 o menor e menos relevante. -->
<h1>Portifólio</h1>
<h2>Programação</h2>
<h3>HTML</h3>
<h4>CSS</h4>
<h5>JS</h5>
<h6>Matemática</h6>
<!--Paragráfo de texto são gerados em HTML por meio das tag <P></p>. Esse é um exemplo de tag cuja disposição na tela se dá em formato-->
</body> <!--Fechamento da tag -->
</html><!--fim do codigo-->
